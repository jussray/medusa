name: registry
on: [push, pull_request]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify archival registry (no skill execution)
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          g = json.loads(Path("registry/medusa.json").read_text())
          assert g["skill"] == "medusa"
          assert g["repository"] == "jussray/medusa"
          assert g["execution_authorization"] == "none"
          assert g["manual_handoff"]["execution_enabled"] is False
          assert Path(g["manual_handoff"]["contract_path"]).is_file()
          records = g["records"]
          assert len({r["id"] for r in records}) == len(records)
          r = next(r for r in records if r["id"] == "MEDUSA-1.1")
          assert r["path"] == "medusa-v1_1-SKILL.md"
          data = Path(r["path"]).read_bytes()
          assert hashlib.sha1(("blob " + str(len(data)) + chr(0)).encode() + data).hexdigest() == r["source_blob"]
          archives = g["archives"]
          listed = {a["path"] for a in archives}
          assert len(listed) == len(archives), "duplicate archive paths"
          tracked = {p.decode("utf-8") for p in __import__("subprocess").check_output(["git", "ls-files", "-z"]).split(b"\x00") if p.endswith(b".zip")}
          assert listed == tracked, "archive inventory coverage drift"
          for a in archives:
              path = Path(a["path"])
              assert path.is_file() and not path.is_symlink()
              data = path.read_bytes()
              actual = hashlib.sha1(("blob " + str(len(data)) + chr(0)).encode() + data).hexdigest()
              assert actual == a["git_blob"], "archive blob mismatch: " + a["path"]
          print(f"Registry metadata, skill blob and {len(archives)} archive blobs verified; no archive extracted or skill executed.")
          PY
      - name: Install pinned synthetic evidence dependency
        run: python3 -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Test synthetic Layer 4 model (no operational effects)
        working-directory: lab
        run: python3 -W error::ResourceWarning -m unittest -v test_actuator_lab test_actuator_concurrency test_journal_lab test_evidence_lab
